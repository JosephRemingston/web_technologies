<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Book Tracker - XML DOM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Library Book Tracker</h1>
            <p>Manage your library collection with XML DOM</p>
        </header>

        <!-- Load Books Button -->
        <div class="action-section">
            <button id="loadBooksBtn" class="btn btn-primary">Load Books from XML</button>
            <span id="loadingIndicator" class="loading hidden">Loading...</span>
        </div>

        <!-- Add New Book Form -->
        <div class="form-section">
            <h2>Add New Book</h2>
            <form id="addBookForm">
                <div class="form-group">
                    <label for="bookTitle">Book Title:</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Author:</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label for="bookStatus">Status:</label>
                    <select id="bookStatus" required>
                        <option value="available">Available</option>
                        <option value="borrowed">Borrowed</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Add Book</button>
            </form>
        </div>

        <!-- Statistics -->
        <div id="statistics" class="statistics hidden">
            <div class="stat-card">
                <h3>Total Books</h3>
                <span id="totalBooks" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <h3>Available</h3>
                <span id="availableBooks" class="stat-value">0</span>
            </div>
            <div class="stat-card">
                <h3>Borrowed</h3>
                <span id="borrowedBooks" class="stat-value">0</span>
            </div>
        </div>

        <!-- Books Table -->
        <div id="booksTableContainer" class="table-container hidden">
            <h2>Book Collection</h2>
            <table id="booksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="booksTableBody">
                    <!-- Books will be populated here -->
                </tbody>
            </table>
        </div>

        <!-- Messages -->
        <div id="message" class="message hidden"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
